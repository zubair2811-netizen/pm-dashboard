<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<title>Resource Hub</title>
<script src="https://cdn.tailwindcss.com"></script>
<style type="text/tailwindcss">
  .btn { @apply rounded-md border border-slate-200 bg-white px-2.5 py-1.5 hover:bg-slate-50; }
  .pill { @apply rounded-full border border-slate-200 bg-white px-2.5 py-1 text-xs; }
  .pill-on { @apply border-slate-900 bg-slate-900 text-white; }
  .inp { @apply w-full rounded-md border border-slate-200 bg-white px-2.5 py-1.5 text-sm text-slate-900; }
  .t th, .t td { @apply px-3 py-2 text-left; }
  .tab-on { @apply bg-white text-slate-900; }
  .go { @apply rounded-md bg-slate-900 px-3 py-1.5 font-medium text-white hover:bg-slate-700; }
</style>
</head>
<body class="bg-slate-50 text-sm text-slate-900">
<nav class="flex flex-wrap items-center gap-3 bg-slate-900 px-4 py-2.5 text-slate-300">
  <span class="mr-3 font-semibold text-white">Resource Hub</span>
  <button data-tab="a" class="rounded-md px-3 py-1.5">Weekly Allocation &amp; Standup</button>
  <button data-tab="b" class="rounded-md px-3 py-1.5">Leave &amp; Entitlements</button>
  <button data-tab="c" class="rounded-md px-3 py-1.5">Master Data</button>
</nav>
<main id="app" class="mx-auto max-w-[1500px] p-4"></main>
<div id="modal"></div>
<div id="toast" class="fixed bottom-4 right-4 z-[60] space-y-2"></div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (x) => String(x == null ? "" : x).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const SLOTS = [...Array(12)].map((_, i) => { const h = i + 8, ap = (x) => (x < 12 ? "AM" : "PM"), f = (x) => x % 12 || 12;
  return ap(h) === ap(h + 1) ? `${f(h)}-${f(h + 1)} ${ap(h)}` : `${f(h)} ${ap(h)}-${f(h + 1)} ${ap(h + 1)}`; });
const DOW = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const LEAVE_TYPES = ["Vacation", "Sick", "Maternity/Paternity", "TOIL", "WFH", "Bank Holiday"];
const ymd = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const parse = (s) => new Date(s + "T00:00:00");
const addD = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const monday = (s) => { const d = parse(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ymd(d); };
const weekdays = (a, b) => { let n = 0; for (let d = a; d <= b; d = addD(d, 1)) { const w = parse(d).getDay(); if (w > 0 && w < 6) n++; } return n; };
const TODAY = ymd(new Date());

const S = { tab: "a", week: monday(TODAY), days: new Set([0, 1, 2, 3, 4]), res: new Set(), resOpen: false, open: new Set(), year: new Date().getFullYear(), loading: false,
  d: { resources: [], projects: [], assignments: [], leaveSettings: [], leaveRecords: [] } };
const openDefault = () => new Set([[...S.days].some((i) => addD(S.week, i) === TODAY) ? TODAY : addD(S.week, [...S.days].sort()[0] || 0)]);

const active = () => S.d.resources.filter((r) => r.Status !== "Inactive");
const proj = (id) => S.d.projects.find((p) => p.ProjectID === id);
const isOn = (v) => v === true || v === "TRUE";
const leaveOn = (rid, date) => S.d.leaveRecords.filter((l) => l.ResourceID === rid && l.StartDate <= date && date <= (l.EndDate || l.StartDate));

function call(fn, ...a) {
  return new Promise((ok, no) => google.script.run.withSuccessHandler(ok)
    .withFailureHandler((e) => { toast((e && e.message) || String(e), true); no(e); })[fn](...a));
}
function toast(m, bad) {
  const t = document.createElement("div");
  t.className = "rounded-md px-4 py-2 text-white shadow-lg " + (bad ? "bg-red-600" : "bg-slate-900");
  t.textContent = m; $("#toast").appendChild(t); setTimeout(() => t.remove(), 4000);
}
const modal = (h) => { $("#modal").innerHTML = `<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 p-4"><div class="max-h-[90vh] w-full max-w-md overflow-auto rounded-xl bg-white p-5 shadow-xl">${h}</div></div>`; };
const closeModal = () => { $("#modal").innerHTML = ""; };

async function load() {
  S.loading = true; render();
  try { S.d = await call("getData", S.week, addD(S.week, 5)); } catch (e) {}
  S.loading = false; render();
}

/* ---------- Tab A: weekly matrix ---------- */
function tabA() {
  return `<div class="mb-3 flex flex-wrap items-center gap-2">
    <button data-act="wk" data-n="-7" class="btn">‹</button><span class="px-1 font-medium">Week of ${S.week}</span><button data-act="wk" data-n="7" class="btn">›</button><button data-act="wk" data-n="0" class="btn">This week</button>
    <div class="ml-2 flex gap-1">${DOW.map((d, i) => `<button data-act="day" data-i="${i}" class="pill ${S.days.has(i) ? "pill-on" : ""}">${d}</button>`).join("")}</div>
    <div class="relative"><button data-act="resmenu" class="btn">Resources: ${S.res.size || "All"} ▾</button>
      ${S.resOpen ? `<div class="absolute z-30 mt-1 max-h-72 w-60 overflow-auto rounded-lg border bg-white p-2 shadow-lg"><button data-act="resclear" class="mb-1 text-xs text-slate-500 underline">Show all / close</button>${active().map((r) => `<label class="flex items-center gap-2 py-0.5"><input type="checkbox" data-act="restoggle" data-id="${r.ResourceID}" ${S.res.has(r.ResourceID) ? "checked" : ""}>${esc(r.Name)}</label>`).join("")}</div>` : ""}</div>
    <button data-act="standup" class="go ml-auto">Quick Standup</button></div>
    <div class="space-y-3">${matrix()}</div>`;
}
function matrix() {
  const rs = active().filter((r) => !S.res.size || S.res.has(r.ResourceID)), am = {};
  S.d.assignments.forEach((a) => (am[[a.Date, a.ResourceID, a.TimeSlot].join("|")] = a));
  return [...S.days].sort((a, b) => a - b).map((i) => {
    const date = addD(S.week, i), open = S.open.has(date), td = date === TODAY;
    return `<section class="rounded-lg border bg-white ${td ? "border-slate-900" : "border-slate-200"}">
      <button data-act="toggle" data-date="${date}" class="flex w-full items-center justify-between px-4 py-2.5 text-left font-semibold"><span>${DOW[i]} ${date}${td ? ' <span class="ml-2 rounded bg-slate-900 px-1.5 py-0.5 text-[11px] text-white">Today</span>' : ""}</span><span class="text-slate-400">${open ? "−" : "+"}</span></button>
      ${open ? `<div class="overflow-x-auto border-t border-slate-100"><table class="border-separate border-spacing-0 text-xs"><thead><tr><th class="sticky left-0 z-10 min-w-[170px] bg-slate-50 px-3 py-2 text-left">Resource</th>${SLOTS.map((t) => `<th class="min-w-[90px] bg-slate-50 px-1 py-2 font-medium text-slate-500">${t}</th>`).join("")}</tr></thead><tbody>${rs.map((r) => row(r, date, am)).join("") || '<tr><td class="p-6 text-slate-500">No resources yet. Add some under Master Data.</td></tr>'}</tbody></table></div>` : ""}</section>`;
  }).join("") || '<p class="text-slate-500">Select at least one day.</p>';
}
function row(r, date, am) {
  const lv = leaveOn(r.ResourceID, date), blk = lv.find((l) => l.LeaveType !== "WFH"), wfh = lv.find((l) => l.LeaveType === "WFH");
  return `<tr><td class="sticky left-0 z-10 border-t border-slate-100 bg-white px-3 py-1"><div class="font-medium">${esc(r.Name)} ${wfh ? '<span class="rounded bg-sky-100 px-1 text-[10px] text-sky-700">WFH</span>' : ""}</div><div class="text-[11px] text-slate-400">${esc(r.Role)}</div></td>` +
    SLOTS.map((t, i) => {
      if (blk && (Number(blk.Duration) === 1 || i < 6)) return `<td class="border-t border-slate-100 p-0.5"><div class="h-9 rounded bg-slate-200 pt-2.5 text-center text-[10px] text-slate-500" title="${esc(blk.LeaveType)} (${esc(blk.Status)})">${blk.LeaveType === "Bank Holiday" ? "Holiday" : "On Leave"}</div></td>`;
      const a = am[[date, r.ResourceID, t].join("|")], p = a && proj(a.ProjectID), bl = a && a.BlockerNotes;
      const st = p ? `background:${esc(p.ColorCode)}26;border-left:3px solid ${esc(p.ColorCode)}` : "";
      const tip = a ? esc((p ? p.ProjectName : "") + ": " + a.TaskDescription + (bl ? " | BLOCKER" + (isOn(a.IsCriticalBlocker) ? " (critical path)" : "") + ": " + bl : "")) : "Free, click to assign";
      return `<td class="border-t border-slate-100 p-0.5"><button data-act="cell" data-res="${r.ResourceID}" data-date="${date}" data-slot="${i}" style="${st}" title="${tip}" class="relative h-9 w-full truncate rounded px-1 text-left text-[11px] ${a ? "" : "border border-dashed border-slate-200 text-slate-300 hover:bg-slate-50"} ${bl ? "ring-2 ring-red-500" : ""}">${a ? esc(p ? p.ProjectName : "?") : "Free"}${bl ? '<span class="absolute right-0.5 top-0.5 h-4 w-4 rounded-full bg-red-600 text-center text-[10px] leading-4 text-white">!</span>' : ""}</button></td>`;
    }).join("") + "</tr>";
}
function standup(rid, date, i) {
  const a = rid && i != null ? S.d.assignments.find((x) => x.Date === date && x.ResourceID === rid && x.TimeSlot === SLOTS[i]) : null;
  const o = (arr, sel) => arr.map(([v, t]) => `<option value="${esc(v)}" ${v == sel ? "selected" : ""}>${esc(t)}</option>`).join("");
  const L = "block text-xs text-slate-500";
  modal(`<h3 class="text-base font-semibold">Standup update</h3><div class="mt-3 grid grid-cols-2 gap-3">
    <label class="col-span-2 ${L}">Resource<select id="m-res" class="inp mt-1">${o(active().map((r) => [r.ResourceID, r.Name]), rid)}</select></label>
    <label class="${L}">Date<input id="m-date" type="date" value="${date || TODAY}" class="inp mt-1"></label>
    <label class="${L}">Project<select id="m-proj" class="inp mt-1"><option value="">Free (clear slots)</option>${o(S.d.projects.filter((p) => p.Status === "Active").map((p) => [p.ProjectID, p.ProjectName]), a && a.ProjectID)}</select></label>
    <label class="${L}">From<select id="m-from" class="inp mt-1">${o(SLOTS.map((t, k) => [k, t]), i || 0)}</select></label>
    <label class="${L}">To<select id="m-to" class="inp mt-1">${o(SLOTS.map((t, k) => [k, t]), i || 0)}</select></label>
    <label class="col-span-2 ${L}">Task<input id="m-task" class="inp mt-1" value="${esc(a ? a.TaskDescription : "")}"></label>
    <label class="col-span-2 flex items-center gap-2"><input id="m-bl" type="checkbox" ${a && a.BlockerNotes ? "checked" : ""}> Is Blocker?</label>
    <label class="col-span-2 ${L}">Blocker description / critical path dependency<textarea id="m-bn" rows="2" class="inp mt-1">${esc(a ? a.BlockerNotes : "")}</textarea></label>
    <label class="col-span-2 flex items-center gap-2"><input id="m-cr" type="checkbox" ${a && isOn(a.IsCriticalBlocker) ? "checked" : ""}> Blocks the critical path</label></div>
    <div class="mt-4 flex justify-end gap-2"><button data-act="close" class="btn">Cancel</button><button data-act="saveStandup" class="go">Save</button></div>`);
}
async function saveStandup() {
  const g = (id) => $("#" + id), from = +g("m-from").value, to = Math.max(from, +g("m-to").value), bl = g("m-bl").checked;
  const p = { date: g("m-date").value, resourceId: g("m-res").value, projectId: g("m-proj").value, slots: SLOTS.slice(from, to + 1), task: g("m-task").value.trim(), blocker: bl ? g("m-bn").value.trim() || "Blocked" : "", critical: bl && g("m-cr").checked };
  if (!p.date || !p.resourceId) return toast("Pick a resource and a date", true);
  try { await call("saveAssignments", p); toast(p.projectId ? "Standup saved" : "Slots freed"); closeModal(); await load(); } catch (e) {}
}

/* ---------- Tab B: leave ---------- */
function bal(r) {
  const ls = S.d.leaveSettings.find((x) => x.ResourceID === r.ResourceID && String(x.Year) === String(S.year)) || {};
  const u = { Vacation: 0, Sick: 0, "Bank Holiday": 0, WFH: 0 };
  S.d.leaveRecords.filter((l) => l.ResourceID === r.ResourceID && String(l.StartDate).slice(0, 4) === String(S.year) && l.Status === "Approved")
    .forEach((l) => { if (l.LeaveType in u) u[l.LeaveType] += weekdays(l.StartDate, l.EndDate || l.StartDate) * Number(l.Duration || 1); });
  const vq = Number(ls.TotalVacationQuota) || 0, sq = Number(ls.TotalSickQuota) || 0, bq = Number(ls.TotalBankHolidays) || 0;
  return { vq, sq, bq, u, vb: vq - u.Vacation, sb: sq - u.Sick, net: vq - u.Vacation + sq - u.Sick }; // WFH never deducts
}
function tabB() {
  const B = active().map((r) => ({ r, ...bal(r) })), recs = S.d.leaveRecords.filter((l) => String(l.StartDate).slice(0, 4) === String(S.year));
  const sum = (k) => B.reduce((n, b) => n + b.u[k], 0);
  const card = (t, v) => `<div class="rounded-lg border border-slate-200 bg-white p-3"><div class="text-xs text-slate-500">${t}</div><div class="mt-1 text-2xl font-semibold">${v}</div></div>`;
  const num = (r, k, v) => `<input type="number" min="0" step="0.5" data-act="quota" data-res="${r.ResourceID}" data-k="${k}" value="${v}" class="w-16 rounded border border-slate-200 px-1.5 py-0.5">`;
  const red = (n) => (n < 0 ? "text-red-600" : "");
  return `<div class="mb-3"><label class="text-xs text-slate-500">Year <input type="number" data-act="year" value="${S.year}" class="ml-1 w-20 rounded border border-slate-200 px-1.5 py-0.5"></label> <span class="ml-2 text-xs text-slate-400">Only approved records count towards balances.</span></div>
  <div class="mb-4 grid grid-cols-2 gap-3 md:grid-cols-4">${card("Vacation days used", sum("Vacation"))}${card("Sick days used", sum("Sick"))}${card("WFH days (not deducted)", sum("WFH"))}${card("Pending requests", recs.filter((l) => l.Status === "Pending").length)}</div>
  <div class="mb-4 overflow-x-auto rounded-lg border border-slate-200 bg-white"><table class="t w-full min-w-[950px] text-xs"><thead class="bg-slate-50 text-slate-500"><tr>${["Resource", "Vacation quota", "Used", "Balance", "Sick quota", "Used", "Balance", "Bank hol. quota", "Taken", "WFH days", "Net available"].map((h) => `<th class="font-medium">${h}</th>`).join("")}</tr></thead>
  <tbody class="divide-y divide-slate-100">${B.map((b) => `<tr><td class="font-medium">${esc(b.r.Name)}</td><td>${num(b.r, "TotalVacationQuota", b.vq)}</td><td>${b.u.Vacation}</td><td class="${red(b.vb)}">${b.vb}</td><td>${num(b.r, "TotalSickQuota", b.sq)}</td><td>${b.u.Sick}</td><td class="${red(b.sb)}">${b.sb}</td><td>${num(b.r, "TotalBankHolidays", b.bq)}</td><td>${b.u["Bank Holiday"]}</td><td>${b.u.WFH}</td><td class="font-semibold ${red(b.net)}">${b.net}</td></tr>`).join("") || '<tr><td colspan="11" class="text-slate-500">Add resources under Master Data first.</td></tr>'}</tbody></table></div>
  <div class="mb-4 rounded-lg border border-slate-200 bg-white p-4"><h3 class="mb-3 font-semibold">Log leave / WFH</h3><div class="grid grid-cols-2 gap-3 md:grid-cols-4">
    <select id="l-res" class="inp">${active().map((r) => `<option value="${r.ResourceID}">${esc(r.Name)}</option>`).join("")}</select>
    <select id="l-type" class="inp">${LEAVE_TYPES.map((t) => `<option>${t}</option>`).join("")}</select>
    <input id="l-start" type="date" value="${TODAY}" class="inp" title="Start date"><input id="l-end" type="date" class="inp" title="End date (optional)">
    <select id="l-half" class="inp"><option value="1">Full day</option><option value="0.5">Half day (first 6 slots)</option></select>
    <select id="l-status" class="inp"><option>Approved</option><option>Pending</option></select>
    <input id="l-notes" class="inp" placeholder="Reason / notes"><button data-act="saveLeave" class="go">Add record</button></div></div>
  <div class="overflow-x-auto rounded-lg border border-slate-200 bg-white"><table class="t w-full min-w-[800px] text-xs"><thead class="bg-slate-50 text-slate-500"><tr>${["Resource", "Type", "Dates", "Per day", "Status", "Notes", ""].map((h) => `<th class="font-medium">${h}</th>`).join("")}</tr></thead>
  <tbody class="divide-y divide-slate-100">${recs.map((l) => { const r = S.d.resources.find((x) => x.ResourceID === l.ResourceID);
    return `<tr><td>${esc(r ? r.Name : l.ResourceID)}</td><td>${esc(l.LeaveType)}</td><td>${l.StartDate}${l.EndDate && l.EndDate !== l.StartDate ? " → " + l.EndDate : ""}</td><td>${l.Duration}</td><td>${esc(l.Status)}</td><td>${esc(l.Notes)}</td><td class="whitespace-nowrap">${l.Status === "Pending" ? `<button data-act="approve" data-id="${l.LeaveID}" class="btn !py-0.5">Approve</button> ` : ""}<button data-act="delLeave" data-id="${l.LeaveID}" class="btn !py-0.5">Delete</button></td></tr>`; }).join("") || '<tr><td colspan="7" class="text-slate-500">No leave records for this year.</td></tr>'}</tbody></table></div>`;
}
async function saveLeave() {
  const g = (id) => $("#" + id).value, s = g("l-start"), e = g("l-end") || s;
  if (!g("l-res") || !s) return toast("Choose a resource and a start date", true);
  if (e < s) return toast("End date is before the start date", true);
  const rec = { ResourceID: g("l-res"), LeaveType: g("l-type"), StartDate: s, EndDate: e, Duration: Number(g("l-half")), Status: g("l-status"), Notes: g("l-notes").trim() };
  try { S.d.leaveRecords.push(await call("saveRow", "LeaveRecords", rec)); toast("Leave recorded"); render(); } catch (x) {}
}

/* ---------- Tab C: master data ---------- */
const FORMS = {
  Resources: { id: "ResourceID", label: "resource", f: [["Name", "Name"], ["Role", "Role / skill"], ["Email", "Email", "email"], ["DefaultPlannedHours", "Planned hours per day", "number"], ["Status", "Status", "select", ["Active", "Inactive"]]] },
  Projects: { id: "ProjectID", label: "project", f: [["ProjectName", "Project name"], ["Client", "Client"], ["Status", "Status", "select", ["Active", "Completed", "On Hold"]], ["ColorCode", "Colour", "color"]] },
};
function tabC() {
  const box = (title, sheet, head, rows) => `<div class="rounded-lg border border-slate-200 bg-white"><div class="flex items-center justify-between border-b border-slate-100 px-4 py-3"><h3 class="font-semibold">${title}</h3><button data-act="entity" data-sheet="${sheet}" class="go">Add</button></div><div class="overflow-x-auto"><table class="t w-full text-xs"><thead class="bg-slate-50 text-slate-500"><tr>${head.map((h) => `<th class="font-medium">${h}</th>`).join("")}</tr></thead><tbody class="divide-y divide-slate-100">${rows}</tbody></table></div></div>`;
  const acts = (sheet, id, st) => { const off = sheet === "Resources" ? "Inactive" : "Completed";
    return `<td class="whitespace-nowrap"><button data-act="entity" data-sheet="${sheet}" data-id="${id}" class="btn !py-0.5">Edit</button> <button data-act="setStatus" data-sheet="${sheet}" data-id="${id}" data-st="${st === off ? "Active" : off}" class="btn !py-0.5">${st === off ? "Restore" : sheet === "Resources" ? "Deactivate" : "Archive"}</button></td>`; };
  const rr = S.d.resources.map((r) => `<tr class="${r.Status === "Inactive" ? "opacity-50" : ""}"><td class="font-medium">${esc(r.Name)}</td><td>${esc(r.Role)}</td><td>${esc(r.Email)}</td><td>${esc(r.DefaultPlannedHours)}</td><td>${esc(r.Status)}</td>${acts("Resources", r.ResourceID, r.Status)}</tr>`).join("") || '<tr><td colspan="6" class="text-slate-500">No resources yet.</td></tr>';
  const pr = S.d.projects.map((p) => `<tr class="${p.Status === "Completed" ? "opacity-50" : ""}"><td class="font-medium"><span class="mr-2 inline-block h-3 w-3 rounded-sm align-middle" style="background:${esc(p.ColorCode)}"></span>${esc(p.ProjectName)}</td><td>${esc(p.Client)}</td><td>${esc(p.Status)}</td>${acts("Projects", p.ProjectID, p.Status)}</tr>`).join("") || '<tr><td colspan="4" class="text-slate-500">No projects yet.</td></tr>';
  return `<div class="grid gap-4 xl:grid-cols-2">${box("Resources", "Resources", ["Name", "Role", "Email", "Hours/day", "Status", ""], rr)}${box("Projects", "Projects", ["Project", "Client", "Status", ""], pr)}</div>`;
}
function entity(sheet, id) {
  const F = FORMS[sheet], o = S.d[sheet.toLowerCase()].find((x) => x[F.id] === id) || { Status: "Active", DefaultPlannedHours: 8, ColorCode: "#6366f1" };
  modal(`<h3 class="text-base font-semibold">${id ? "Edit" : "Add"} ${F.label}</h3><div class="mt-3 space-y-3">${F.f.map(([k, t, ty, opts]) => `<label class="block text-xs text-slate-500">${t}${ty === "select" ? `<select data-k="${k}" class="inp mt-1">${opts.map((v) => `<option ${o[k] === v ? "selected" : ""}>${v}</option>`).join("")}</select>` : `<input data-k="${k}" type="${ty || "text"}" value="${esc(o[k])}" class="inp mt-1">`}</label>`).join("")}</div>
    <div class="mt-4 flex justify-end gap-2"><button data-act="close" class="btn">Cancel</button><button data-act="saveEntity" data-sheet="${sheet}" data-id="${id || ""}" class="go">Save</button></div>`);
}
function upsertLocal(sheet, r) { const L = S.d[sheet.toLowerCase()], k = FORMS[sheet].id, i = L.findIndex((x) => x[k] === r[k]); i < 0 ? L.push(r) : (L[i] = r); }
async function saveEntity(sheet, id) {
  const F = FORMS[sheet], o = id ? { ...S.d[sheet.toLowerCase()].find((x) => x[F.id] === id) } : {};
  document.querySelectorAll("#modal [data-k]").forEach((e) => (o[e.dataset.k] = e.type === "number" ? Number(e.value) : e.value.trim()));
  if (!(o.Name || o.ProjectName)) return toast("A name is required", true);
  try { upsertLocal(sheet, await call("saveRow", sheet, o)); closeModal(); toast("Saved"); render(); } catch (e) {}
}
async function setStatus(sheet, id, st) {
  const o = { ...S.d[sheet.toLowerCase()].find((x) => x[FORMS[sheet].id] === id), Status: st };
  try { upsertLocal(sheet, await call("saveRow", sheet, o)); toast("Updated"); render(); } catch (e) {}
}

/* ---------- Wiring ---------- */
function render() {
  document.querySelectorAll("[data-tab]").forEach((b) => b.classList.toggle("tab-on", b.dataset.tab === S.tab));
  $("#app").innerHTML = (S.loading ? '<div class="mb-2 text-xs text-slate-500">Loading…</div>' : "") + { a: tabA, b: tabB, c: tabC }[S.tab]();
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act],[data-tab]");
  if (!t) return;
  const d = t.dataset, a = d.act;
  if (d.tab) { S.tab = d.tab; return render(); }
  if (a === "toggle") { S.open.has(d.date) ? S.open.delete(d.date) : S.open.add(d.date); render(); }
  else if (a === "wk") { S.week = +d.n ? addD(S.week, +d.n) : monday(TODAY); S.open = openDefault(); load(); }
  else if (a === "day") { const i = +d.i; S.days.has(i) ? S.days.delete(i) : S.days.add(i); S.open = new Set([...S.open, ...[...S.days].map((x) => addD(S.week, x)).filter((x) => x === TODAY)]); render(); }
  else if (a === "resmenu") { S.resOpen = !S.resOpen; render(); }
  else if (a === "resclear") { S.res.clear(); S.resOpen = false; render(); }
  else if (a === "restoggle") { S.res.has(d.id) ? S.res.delete(d.id) : S.res.add(d.id); render(); }
  else if (a === "cell") standup(d.res, d.date, +d.slot);
  else if (a === "standup") standup();
  else if (a === "close") closeModal();
  else if (a === "saveStandup") saveStandup();
  else if (a === "saveLeave") saveLeave();
  else if (a === "entity") entity(d.sheet, d.id);
  else if (a === "saveEntity") saveEntity(d.sheet, d.id);
  else if (a === "setStatus") setStatus(d.sheet, d.id, d.st);
  else if (a === "approve" || a === "delLeave") {
    const l = S.d.leaveRecords.find((x) => x.LeaveID === d.id);
    if (a === "delLeave" && !confirm("Delete this leave record?")) return;
    (a === "approve" ? call("saveRow", "LeaveRecords", { ...l, Status: "Approved" }) : call("removeRow", "LeaveRecords", { LeaveID: d.id }).then(() => null))
      .then((r) => { S.d.leaveRecords = r ? S.d.leaveRecords.map((x) => (x.LeaveID === d.id ? r : x)) : S.d.leaveRecords.filter((x) => x.LeaveID !== d.id); toast(r ? "Approved" : "Deleted"); render(); }).catch(() => {});
  }
});
document.addEventListener("change", async (e) => {
  const t = e.target, a = t.dataset.act;
  if (a === "year") { S.year = +t.value || S.year; render(); }
  if (a === "quota") {
    const o = { ResourceID: t.dataset.res, Year: S.year };
    t.closest("tr").querySelectorAll("[data-act=quota]").forEach((i) => (o[i.dataset.k] = Number(i.value) || 0));
    try {
      await call("saveRow", "LeaveSettings", o);
      const L = S.d.leaveSettings, i = L.findIndex((x) => x.ResourceID === o.ResourceID && String(x.Year) === String(o.Year));
      i < 0 ? L.push(o) : (L[i] = o); toast("Quota saved"); render();
    } catch (x) {}
  }
});
S.open = openDefault();
load();
</script>
</body>
</html>
